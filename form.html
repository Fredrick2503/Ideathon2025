<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ideathon 2026 Registration Closed</title>

  <!-- Standard icon library -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    * { box-sizing: border-box; }

    :root {
      --primary: #111827;
      --muted: #667085;
      --border: #d0d5dd;
      --bg: #f6f7f9;
      --white: #ffffff;
      --success: #027a48;
    }

    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--primary);
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 48px 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
    }

    .card {
      background: var(--white);
      padding: 48px 36px;
      border: 1px solid #e4e7ec;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(16, 24, 40, .06);
    }

    .brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .success-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: #f2f4f7;
      color: var(--primary);
      display: grid;
      place-items: center;
      font-size: 26px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: -.02em;
    }

    p {
      margin: 0 auto 32px;
      max-width: 460px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 48px;
      padding: 0 24px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: white;
      font: inherit;
      font-weight: 600;
      text-decoration: none;
      transition: opacity .15s, transform .15s;
      box-shadow: 0 4px 12px rgba(17, 24, 39, 0.15);
    }

    .btn-home:hover {
      opacity: .9;
      transform: translateY(-1px);
    }

    .footer-note {
      margin-top: 24px;
      text-align: center;
      color: #98a2b3;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="container">
      <div class="card">
        <div class="brand">AICTE IDEA LAB · New Horizon College of Engineering</div>
        
        <div class="success-icon">
          <i class="fa-solid fa-calendar-xmark"></i>
        </div>

        <h1>Registration Closed</h1>

        <p>
          Thank you for your overwhelming response to Ideathon 2026. Registrations are now officially closed. 
          See you in <strong>Ideathon 2027</strong>!
        </p>

      </div>

      <div class="footer-note">
        AICTE IDEA LAB · New Horizon College of Engineering
      </div>
    </div>
  </main>
</body>
</html>
