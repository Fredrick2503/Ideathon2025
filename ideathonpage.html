<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideathon 2026</title>

<!-- Keep the same styling dependencies used by the original page. -->
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">

<style>
#hero {
    background-image: linear-gradient(rgb(25 47 89 / 84%), rgb(25 47 89 / 84%)), url("https://newhorizoncollegeofengineering.in/wp-content/uploads/2023/10/1E9A4524_1920X500-1.jpg");
    background-size: cover;
    background-position: center;
    height: 60svh;
    padding: 60px 30px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
}
#hero h1 {
    font-size: 4.5rem;
    margin-bottom: 20px;
    color: white;
    font-weight: 700;
}
@media (max-width: 768px) {
    #hero h1 { font-size: 4rem; }
}
@media (max-width: 480px) {
    #hero h1 { font-size: 3rem; }
}
#hero h2 {
    font-size: 3rem;
    margin-bottom: 20px;
    color: white;
    font-weight: 700;
}
@media (max-width: 768px) {
    #hero h2 { font-size: 2.5rem; }
}
@media (max-width: 480px) {
    #hero h2 { font-size: 2rem; }
}
#hero p {
    font-size: 1rem;
    margin-bottom: 10px;
    color: rgb(223, 224, 225);
}
#register-button {
    background-color: rgb(234 88 12);
    font-weight: 600;
    font-size: 1.125rem;
    line-height: 1.75rem;
    padding-left: 2.5rem;
    padding-right: 2.5rem;
    border-radius: 9999px;
    cursor: pointer;
}
#veiw-button {
    background-color: rgb(255 255 255 / .1);
    border-color: rgb(255 255 255 / .3);
    color: rgb(255 255 255 / 1);
    font-weight: 600;
    font-size: 1.125rem;
    line-height: 1.75rem;
    padding-left: 2.5rem;
    padding-right: 2.5rem;
    border-radius: 9999px;
    cursor: pointer;
}
.a { background-color: #2563eb; }
.ia { background-color: #d1d5db; }
</style>
</head>

<body>
<main id="content" class="site-main">
<div class="page-content">

<!-- =========================
     HERO
========================= -->
<div id="hero">
    <div id="hercon">
        <h1 id="heroTitle"></h1>
        <div class="flex items-center justify-center mb-4">
            <div class="w-16 h-0.5 bg-white/50 mr-4"></div>
            <h2 id="heroSubtitle" class="text-2xl md:text-3xl font-light text-blue-100"></h2>
            <div class="w-16 h-0.5 bg-white/50 ml-4"></div>
        </div>
        <p id="heroTagline" class="text-xl md:text-2xl mb-12 font-medium text-gray-200"></p>
        <div class="flex flex-col sm:flex-row gap-6 justify-center items-center my-12">
            <a href="#registration">
                <button id="register-button" class="px-10 py-4 rounded-full text-lg font-semibold whitespace-nowrap transition-all duration-300 cursor-pointer flex items-center gap-3 bg-orange-600 text-white hover:bg-orange-500 hover:shadow-xl"></button>
            </a>
            <a id="rulebookLink" download hidden>
                <button id="veiw-button" class="px-10 py-4 rounded-full text-lg font-semibold whitespace-nowrap transition-all duration-300 cursor-pointer flex items-center gap-3 bg-white/10 backdrop-blur-sm text-white border-2 border-white/30 hover:bg-white hover:text-blue-900"></button>
            </a>
        </div>
    </div>
</div>

<!-- =========================
     ABOUT
========================= -->
<section class="py-10 bg-gray-50" id="about" data-animate="true">
<div class="max-w-6xl mx-auto px-6">
<div class="transition-all duration-1000 opacity-100 translate-y-0">
<div class="text-center mb-16">
    <h2 id="aboutTitle" class="text-2xl md:text-3xl font-bold text-gray-900" style="font-weight: 900;"></h2>
    <div class="w-24 h-1 bg-blue-600 mx-auto mb-8"></div>
</div>
<div class="grid md:grid-cols-2 gap-12 items-center">

    </div>
    <div class="relative">
        <div class="bg-white rounded-lg shadow-lg p-8">
            <div id="stats" class="grid grid-cols-1 gap-6 text-center"></div>
        </div>
    </div>
</div>
</div>
</div>
</section>

<!-- =========================
     ELIGIBILITY
========================= -->
<section class="py-10 bg-white" id="eligibility">
<div class="max-w-6xl mx-auto px-6">
<div class="text-center mb-16">
    <h2 id="eligibilityTitle" class="text-2xl md:text-3xl font-bold text-gray-900 mb-4" style="font-weight: 900;"></h2>
    <div class="w-24 h-1 bg-blue-600 mx-auto mb-8"></div>
    <p id="eligibilitySubtitle" class="text-xl text-gray-600 max-w-3xl mx-auto"></p>
</div>
<div id="eligibilityItems" class="grid md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
<div class="mt-12 bg-blue-50 rounded-lg p-8 text-center">
    <div class="flex items-center justify-center mb-4">
        <i class="ri-information-line w-8 h-8 flex items-center justify-center text-blue-600 mr-3"></i>
        <h3 id="eligibilityNoteTitle" class="text-2xl font-bold text-gray-900" style="font-weight: 700;"></h3>
    </div>
    <div id="eligibilityNotes"></div>
</div>
</div>
</section>

<!-- =========================
     TRACKS
========================= -->
<section class="py-10 bg-gray-50">
<div class="max-w-7xl mx-auto px-6">
<h2 class="text-2xl md:text-3xl font-bold text-gray-900 mb-12 text-center" style="font-weight: 900;">Tracks &amp; Problem Statements</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="tracksGrid"></div>
</div>
</section>

<!-- =========================
     RULES
========================= -->
<section class="py-10 bg-white">
<div class="max-w-4xl mx-auto px-6">
<h2 id="rulesTitle" class="text-2xl md:text-3xl font-bold text-gray-900 mb-12 text-center" style="font-weight:900;"></h2>
<div class="bg-red-50 rounded-2xl p-8 md:p-12">
    <ul id="rulesList" class="flex flex-col gap-2"></ul>
</div>
</div>
</section>

<!-- =========================
     PRIZES
========================= -->
<section class="py-10 bg-gradient-to-br from-yellow-50 to-orange-50">
<div class="max-w-4xl mx-auto px-6 text-center">
<h2 id="prizesTitle" class="text-2xl md:text-3xl font-bold text-gray-900 mb-12" style="font-weight:900;"></h2>
<div class="bg-white rounded-2xl p-8 md:p-12 shadow-xl">
    <div class="mb-8">
        <p class="text-2xl md:text-3xl font-bold text-gray-800 mb-4">
            Total <span id="prizePool" class="text-4xl" style="color:#2855a7d6;"></span> <span id="prizePoolText"></span>
        </p>
    </div>
    <div id="placements" class="grid md:grid-cols-3 gap-8 mb-8"></div>
    <div class="bg-blue-50 rounded-xl p-6">
        <p id="certificateText" class="text-lg md:text-xl font-semibold text-blue-800"></p>
    </div>
</div>
</div>
</section>

<!-- =========================
     REGISTRATION
========================= -->
<section id="registration" class="py-10 bg-white">
<div class="max-w-4xl mx-auto px-6">
<div class="text-center mb-3">
    <h2 id="registrationTitle" class="text-2xl md:text-3xl font-bold text-gray-900 mb-6" style="font-weight:900;"></h2>
    <p id="registrationSubtitle" class="text-xl text-gray-700 mb-8"></p>

    <div class="bg-blue-50 rounded-2xl p-8 mb-8">
        <h3 id="registrationInfoTitle" class="text-2xl font-bold text-blue-900 mb-6 text-center" style="font-weight:700;"></h3>
        <div id="registrationCards" class="grid md:grid-cols-3 gap-6 text-center"></div>
    </div>

    <p id="registrationNote" class="text-lg"></p>
</div>

<div class="text-center my-4" hidden>
    <div class="flex flex-col sm:flex-row gap-4 justify-center">
        <button class="px-6 py-3 bg-gray-600 text-white rounded-lg font-semibold hover:bg-gray-700 transition-colors cursor-pointer whitespace-nowrap"
            id="registrationRulebookButton"></button>
    </div>
</div>

<!-- <iframe id="registrationForm" width="640" height="2130" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe> -->
</div>
</section>

</div>
</main>

<script>
(function () {
    "use strict";

    const data = JSON.parse(document.getElementById("page-data").textContent);

    // ---------- Helpers ----------
    const el = (id) => document.getElementById(id);
    const setText = (id, value) => { el(id).textContent = value ?? ""; };

    // ---------- Hero ----------
    setText("heroTitle", data.hero.title);
    setText("heroSubtitle", data.hero.subtitle);
    setText("heroTagline", data.hero.tagline);
    setText("register-button", data.hero.registerText);
    setText("veiw-button", data.hero.rulebookText);
    el("rulebookLink").href = data.hero.rulebookUrl;
    document.getElementById("hero").style.backgroundImage =
        `linear-gradient(rgb(25 47 89 / 84%), rgb(25 47 89 / 84%)), url("${data.hero.backgroundImage}")`;

    // ---------- About ----------
    setText("aboutTitle", data.about.title);
    el("aboutParagraphs").innerHTML = data.about.paragraphs
        .map(text => `<p>${text}</p>`)
        .join("") +
        `<p class="text-xl md:text-2xl font-semibold text-blue-600 border-l-4 border-blue-600 pl-4">${data.about.highlight}</p>`;

    el("stats").innerHTML = data.about.stats.map((item, index) => `
      <div class="${index === 0 ? "border-r border-gray-200" : ""}">
        <div class="text-5xl font-bold text-${item.color}-600 mb-2">${item.value}</div>
        <div class="text-md text-gray-600">${item.label}</div>
      </div>
    `).join("");

    setText("eligibilityTitle", data.eligibility.title);
    setText("eligibilitySubtitle", data.eligibility.subtitle);
    el("eligibilityItems").innerHTML = data.eligibility.items.map(item => `
        <div class="bg-gradient-to-br from-blue-50 to-blue-100 rounded-lg p-6 text-center hover:shadow-lg transition-shadow duration-300">
            <h3 class="text-xl font-bold text-gray-900 mb-2" style="font-weight:700;">${item.title}</h3>
            <p class="text-gray-600 text-sm">${item.description}</p>
        </div>
    `).join("");

    setText("eligibilityNoteTitle", data.eligibility.noteTitle);
    el("eligibilityNotes").innerHTML = data.eligibility.notes
        .map(note => `<p class="text-lg text-gray-700">${note}</p>`)
        .join("");

    // ---------- Tracks ----------
      const tracksGrid = el("tracksGrid");

      tracksGrid.innerHTML = data.tracks.map(track => `
        <div class="bg-white rounded-2xl p-8 shadow-lg flex flex-col">
            <h3 class="text-xl md:text-3xl font-bold text-blue-600 mb-6" style="font-weight:600;">${track.title}</h3>
          <ul class="space-y-3">
                ${track.problems.map(problem => `
                    <li class="flex items-start text-lg text-gray-700">
                        <div class="w-2 h-2 bg-blue-500 rounded-full mt-3 mr-4 flex-shrink-0"></div>
                        <span>${problem}</span>
                    </li>
                `).join("")}
            </ul>
        </div>
    `).join("");

    // ---------- Rules ----------
    setText("rulesTitle", data.rules.title);
    el("rulesList").innerHTML = data.rules.items.map(item => `
        <li class="flex items-start text-xl md:text-xl text-gray-800" style="font-size:1.1rem;">
            <div class="w-2 h-2 bg-red-500 rounded-full mt-3 mr-4 flex-shrink-0"></div>
            <span class="font-medium">
                ${item.label ? `<strong>${item.label}</strong> ` : ""}
                ${item.text}
            </span>
        </li>
    `).join("");

    // ---------- Prizes ----------
    setText("prizesTitle", data.prizes.title);
    setText("prizePool", data.prizes.pool);
    setText("prizePoolText", data.prizes.poolText);

    el("placements").innerHTML = data.prizes.placements.map(item => `
        <div class="bg-gradient-to-br ${item.class === "first" ? "from-yellow-100 to-yellow-200" : "from-gray-100 to-gray-200"} rounded-xl p-6">
            <div class="text-3xl mb-2">${item.icon}</div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">${item.title}</h3>
            <p class="text-2xl font-bold ${item.class === "first" ? "text-yellow-700" : "text-gray-700"}">${item.amount}</p>
        </div>
    `).join("");

    setText("certificateText", data.prizes.certificateText);

    // ---------- Registration ----------
    setText("registrationTitle", data.registration.title);
    setText("registrationSubtitle", data.registration.subtitle);
    setText("registrationInfoTitle", data.registration.infoTitle);

    el("registrationCards").innerHTML = data.registration.cards.map(card => `
        <div class="bg-white rounded-lg p-6">
            <h4 class="font-semibold text-gray-900 mb-2">${card.title}</h4>
            <p class="text-gray-700">${card.text}</p>
        </div>
    `).join("");

    setText("registrationNote", data.registration.note);
    setText("registrationRulebookButton", data.registration.rulebookButton);
    el("registrationForm").src = data.registration.formUrl;

    // Same rulebook destination as the hero button.
    el("registrationRulebookButton").addEventListener("click", () => {
        window.open(data.hero.rulebookUrl, "_blank");
    });
})();
</script>
