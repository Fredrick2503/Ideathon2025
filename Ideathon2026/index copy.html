<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideathon 2026 — AICTE IDEA LAB @ NHCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="https://newhorizoncollegeofengineering.in/wp-content/uploads/2025/05/cropped-nhei_favicon_college-192x192.png" sizes="192x192">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F1B38;
  --navy-2:#16244A;
  --ink:#141A24;
  --paper:#F6F4EF;
  --paper-2:#FFFFFF;
  --orange:#EA580C;
  --orange-2:#FF8A3D;
  --teal:#12A9A0;
  --line:#E4E0D6;
  --muted:#5B6270;
  --gold:#D97706;
  --silver:#64748B;
  --bronze:#B45309;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{
  font-family:'Inter',sans-serif;
  letter-spacing:0;
}
a{color:inherit;text-decoration:none;}
img{max-width:100%;display:block;}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px;}
.narrow{max-width:760px;margin:0 auto;padding:0 24px;}

/* ---------- reveal ---------- */
[data-reveal]{opacity:0;transform:translateY(28px) scale(.985);transition:opacity 1.05s cubic-bezier(.16,1,.3,1),transform 1.05s cubic-bezier(.16,1,.3,1);will-change:opacity,transform;}
[data-reveal].in{opacity:1;transform:translateY(0);}
[data-reveal-group] > *{transition-delay:calc(var(--i,0) * 130ms);}
[data-reveal-group].in > *{opacity:1!important;transform:translateY(0)!important;}
@media (prefers-reduced-motion: reduce){
  [data-reveal]{opacity:1!important;transform:none!important;transition:none!important;}
  html{scroll-behavior:auto;}
}

/* ---------- top bar ---------- */
#topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(246,244,239,.96);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
#topbar .inner{
  display:flex;align-items:center;justify-content:space-between;
  min-height:72px;padding:0 24px;max-width:1120px;margin:0 auto;gap:16px;
}
#topbar .brand{display:flex;align-items:center;}
#topbar .brand img{width:250px;height:72px;object-fit:contain;}
#topbar nav{display:flex;gap:22px;}
#topbar nav a{color:var(--muted);font-size:.88rem;font-weight:500;transition:color .2s;}
#topbar nav a:hover{color:var(--navy);}
#topbar .partner-logos{display:flex;align-items:center;gap:14px;}
#topbar .partner-logos img{width:54px;height:42px;object-fit:contain;}
#topbar .partner-logos img:last-child{width:62px;}
@media (max-width:820px){ #topbar nav{display:none;} }
@media (max-width:520px){#topbar .inner{min-height:60px;padding:0 16px;}#topbar .brand img{width:170px;height:60px;}#topbar .partner-logos{gap:8px;}#topbar .partner-logos img{width:42px;height:34px;}#topbar .partner-logos img:last-child{width:48px;}}

/* ---------- hero ---------- */
#hero{
  position:relative;overflow:hidden;min-height:calc(100svh - 72px);display:flex;align-items:center;
  background:
    linear-gradient(rgba(15,48,112,.78),rgba(15,27,56,.88)),
    url("bg.png") center center / cover no-repeat;
  padding:64px 24px 72px;
  color:#fff;
}
#hero .inner{max-width:900px;margin:0 auto;text-align:center;position:relative;z-index:2;transform:translateY(-18px);}
#hero .kicker{
  display:inline-flex;align-items:center;gap:10px;
  font-size:.82rem;color:rgba(255,255,255,.85);
  margin-bottom:26px;font-weight:500;
  background:rgba(255,255,255,0.08);padding:6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,0.15);
}
#hero .kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--orange-2);box-shadow:0 0 8px var(--orange);}
#hero h1{
  font-size:clamp(2.6rem,6vw,4.4rem);
  font-weight:700;line-height:1.04;margin:0 0 18px;color:#fff;
}
#hero h1 em{font-style:italic;color:var(--orange-2);}
#hero .sub{
  font-size:clamp(1.05rem,1.6vw,1.3rem);color:rgba(255,255,255,.85);
  font-weight:400;max-width:640px;margin:0 auto 40px;line-height:1.5;
}
#registrationCountdown{margin:-14px auto 34px;}
#registrationCountdown .countdown-label{font-size:clamp(1rem,1.8vw,1.25rem);font-weight:800;letter-spacing:.12em;color:#fff;text-transform:uppercase;}
#registrationCountdown .countdown-date{font-size:.82rem;color:rgba(255,255,255,.72);margin-top:5px;}
#registrationCountdown .countdown-clock{display:flex;justify-content:center;align-items:flex-end;gap:0;margin-top:14px;flex-wrap:nowrap;}
#registrationCountdown .countdown-unit{position:relative;min-width:72px;padding:0;border:none;background:none;display:flex;flex-direction:column;align-items:center;}
#registrationCountdown .countdown-unit:not(:last-child){padding-right:18px;}
#registrationCountdown .countdown-unit:not(:last-child)::after{content:":";position:absolute;right:3px;top:28%;transform:translateY(-50%);font-size:clamp(1.35rem,3vw,2rem);font-weight:800;line-height:1;color:#fff;}
#registrationCountdown .countdown-value{display:block;font-size:clamp(1.35rem,3vw,2rem);font-weight:800;line-height:1;color:#fff;}
#registrationCountdown .countdown-name{display:block;margin-top:5px;font-size:.62rem;color:rgba(255,255,255,.68);letter-spacing:.08em;text-transform:uppercase;}
@media (max-width:480px){#registrationCountdown .countdown-unit{min-width:58px;}#registrationCountdown .countdown-unit:not(:last-child){padding-right:12px;}}
#hero .actions{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
@media (max-width:600px){#hero{min-height:calc(100svh - 60px);padding:44px 18px 52px;}#hero .inner{transform:translateY(-10px);}#hero .kicker{margin-bottom:18px;}#hero .sub{margin-bottom:28px;font-size:1rem;}#registrationCountdown{margin:-6px auto 26px;}}
#register-button{
  background:var(--orange);color:#fff;font-weight:600;font-size:1.02rem;
  padding:16px 34px;border-radius:999px;border:none;cursor:pointer;
  transition:transform .25s, box-shadow .25s, background .25s;
  box-shadow:0 12px 30px -10px rgba(234,88,12,.6);
  display:inline-flex;align-items:center;gap:10px;
}
#register-button:hover{transform:translateY(-2px);background:var(--orange-2);}
#veiw-button{
  background:rgba(255,255,255,.06);color:#fff;font-weight:600;font-size:1.02rem;
  padding:16px 34px;border-radius:999px;border:1px solid rgba(255,255,255,.25);cursor:pointer;
  transition:transform .25s, background .25s;
  display:inline-flex;align-items:center;gap:10px;
}
#veiw-button:hover{transform:translateY(-2px);background:rgba(255,255,255,.14);}

/* ---------- registration overlay ---------- */
body.registration-open{overflow:hidden;}
#registrationOverlay{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:24px;background:rgba(15,27,56,.62);backdrop-filter:blur(8px);
  opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s ease;
}
#registrationOverlay.is-open{opacity:1;visibility:visible;}
#registrationOverlay .registration-dialog{
  position:relative;width:min(960px,100%);height:min(92vh,900px);background:var(--paper-2);
  border:1px solid rgba(255,255,255,.7);border-radius:18px;overflow:hidden;
  box-shadow:0 28px 80px rgba(15,27,56,.35);transform:translateY(20px) scale(.98);
  transition:transform .55s cubic-bezier(.16,1,.3,1);
}
#registrationOverlay.is-open .registration-dialog{transform:translateY(0) scale(1);}
#registrationOverlay iframe{display:block;width:100%;height:100%;border:0;background:var(--paper);}
#registrationOverlay .close-registration{
  position:absolute;top:14px;right:14px;z-index:2;width:38px;height:38px;border:0;border-radius:50%;
  background:rgba(15,27,56,.86);color:#fff;font-size:1.5rem;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(15,27,56,.22);
}
#registrationOverlay .close-registration:hover{background:var(--orange);}
@media (max-width:600px){#registrationOverlay{padding:10px;}#registrationOverlay .registration-dialog{height:94vh;border-radius:14px;}#registrationOverlay .close-registration{top:10px;right:10px;}}
@media (prefers-reduced-motion:reduce){#registrationOverlay,#registrationOverlay .registration-dialog{transition:none;}}

/* ---------- section basics ---------- */
section{padding:96px 0;}
.section-head{max-width:600px;margin-bottom:56px;}
.section-head .eyebrow{
  font-size:.8rem;color:var(--orange);font-weight:700;margin-bottom:10px;text-transform:uppercase;letter-spacing:0.06em;
}
.section-head h2{font-size:clamp(1.9rem,3vw,2.6rem);font-weight:600;color:var(--ink);margin:0 0 14px;line-height:1.1;}
.section-head p{font-size:1.08rem;color:var(--muted);line-height:1.6;margin:0;}
.rule{width:100%;height:1px;background:var(--line);}

/* ---------- organized-by strip ---------- */
#orgby{background:var(--paper-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;}
#orgby .row{max-width:1120px;margin:0 auto;padding:22px 24px;display:flex;align-items:center;justify-content:center;gap:32px;}
#orgby .label{display:block;flex:0 0 auto;text-align:left;font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0;}
.logo-marquee{position:relative;overflow:hidden;padding:4px 0;}
.logo-marquee::before,.logo-marquee::after{content:"";position:absolute;top:0;bottom:0;width:90px;z-index:2;pointer-events:none;}
.logo-marquee::before{left:0;background:linear-gradient(90deg,var(--paper-2),transparent);}
.logo-marquee::after{right:0;background:linear-gradient(270deg,var(--paper-2),transparent);}
.logo-marquee{flex:0 0 738px;width:738px;max-width:100%;min-width:0;}
.logo-track{display:flex;width:max-content;align-items:center;animation:logo-scroll 24s linear infinite;}
.logo-marquee:hover .logo-track{animation-play-state:paused;}
.logo-item{width:210px;height:82px;margin:0 18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo-item img{width:100%;height:100%;object-fit:contain;}
@keyframes logo-scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
@media (prefers-reduced-motion:reduce){.logo-track{animation:none;transform:none;}.logo-track .logo-item:nth-child(n+4){display:none;}}
@media (max-width:600px){.logo-item{width:150px;height:64px;margin:0 10px;}.logo-marquee::before,.logo-marquee::after{width:42px;}}
@media (max-width:600px){#orgby .row{align-items:stretch;flex-direction:column;gap:14px;padding:18px 20px 22px;}#orgby .label{flex:0 0 auto;text-align:center;}.logo-marquee{width:100%;flex:0 0 auto;}}

/* ---------- about ---------- */
#about{background:var(--paper-2);}
#about .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:64px;align-items:start;}
#about .copy p{font-size:1.08rem;line-height:1.7;color:#333;margin:0 0 20px;}
#about .highlight{
  font-size:1.15rem;font-style:italic;color:var(--navy);
  border-left:3px solid var(--orange);padding-left:20px;margin-top:28px;
  font-family:'Inter',sans-serif;line-height:1.5;
}
#stats{display:flex;flex-direction:column;gap:0;background:var(--navy);border-radius:18px;overflow:hidden;box-shadow:0 20px 40px -15px rgba(15,27,56,0.3);}
#stats .stat{padding:28px 32px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:20px;}
#stats .stat:last-child{border-bottom:none;}
#stats .stat-icon{
  width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,0.07);
  display:flex;align-items:center;justify-content:center;color:var(--orange-2);flex-shrink:0;
}
#stats .stat-info{flex:1;}
#stats .stat .val{font-family:'Inter',sans-serif;font-size:2.4rem;font-weight:700;color:#fff;line-height:1;}
#stats .stat .lab{color:rgba(255,255,255,.65);font-size:.9rem;margin-top:6px;}
@media (max-width:860px){ #about .grid{grid-template-columns:1fr;gap:40px;} }

/* ---------- eligibility ---------- */
#eligibility{background:var(--paper);}
.elig-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
.elig-card{background:var(--paper-2);padding:32px 24px;transition:background .25s;}
.elig-card:hover{background:#fff8f2;}
.elig-icon-wrap{
  width:42px;height:42px;border-radius:10px;background:#FFF0E6;color:var(--orange);
  display:flex;align-items:center;justify-content:center;margin-bottom:16px;
}
.elig-card h3{font-size:1.1rem;font-weight:700;margin:0 0 8px;color:var(--ink);}
.elig-card p{font-size:.92rem;color:var(--muted);margin:0;line-height:1.5;}
.note-box{
  margin-top:40px;background:var(--navy);color:#fff;border-radius:16px;padding:36px 40px;
}
.note-box-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.note-box-header svg{width:24px;height:24px;color:var(--orange-2);}
.note-box h3{font-size:1.3rem;margin:0;font-weight:600;color:#fff;}
.note-box p{color:rgba(255,255,255,.78);line-height:1.6;margin:0 0 10px;font-size:.98rem;display:flex;align-items:flex-start;gap:10px;}
.note-box p svg{width:16px;height:16px;color:var(--teal);flex-shrink:0;margin-top:4px;}
@media (max-width:860px){ .elig-grid{grid-template-columns:1fr 1fr;} }
@media (max-width:520px){ .elig-grid{grid-template-columns:1fr;} }

/* ---------- tracks ---------- */
#tracks{background:var(--paper-2);position:relative;overflow:hidden;}
#tracks::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.45;background-image:linear-gradient(rgba(15,27,56,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(15,27,56,.035) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,transparent,#000 14%,#000 86%,transparent);}
#tracks .wrap{position:relative;z-index:1;}
.tracks-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
.track-card{
  --track-accent:var(--orange);--track-ink:var(--navy);--track-wash:#FFF0E6;
  position:relative;isolation:isolate;overflow:hidden;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:0;
  transition:border-color .3s, transform .3s, box-shadow .3s;
}
.track-card::after{content:"";position:absolute;inset:auto -20% -55% 30%;height:180px;background:radial-gradient(circle,var(--track-wash),transparent 68%);opacity:.8;z-index:-1;transition:transform .5s ease,opacity .3s;}
.track-card:hover,.track-card:focus-within{border-color:var(--track-accent);transform:translateY(-5px);box-shadow:0 22px 44px -24px rgba(20,26,36,.35);}
.track-card:hover::after,.track-card:focus-within::after{transform:scale(1.3);opacity:1;}
.track-header{display:flex;align-items:center;gap:14px;margin:0;padding:24px 28px 20px;border-bottom:1px solid rgba(20,26,36,.08);background:linear-gradient(135deg,var(--track-wash),transparent 70%);}
.track-badge{
  width:46px;height:46px;border-radius:14px;background:var(--track-accent);color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 8px 18px -10px var(--track-accent);transition:transform .3s ease;
}
.track-card:hover .track-badge,.track-card:focus-within .track-badge{transform:rotate(-6deg) scale(1.08);}
.track-card h3{font-size:1.3rem;font-weight:700;color:var(--track-ink);margin:0;line-height:1.2;}
.track-card .scene{position:relative;margin:0 28px;padding:20px 0 24px;}
.track-card .scene p{font-size:.95rem;color:#3a3f47;line-height:1.6;margin:0;}
.track-card .scene-label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px;color:var(--track-accent);font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;}
.track-card .scene-label span:last-child{color:var(--muted);font-weight:600;letter-spacing:.04em;}
@media (prefers-reduced-motion:reduce){.track-card,.track-badge{transition:none;}}
@media (max-width:820px){ .tracks-grid{grid-template-columns:1fr;} }

/* ---------- rules ---------- */
#rules{background:var(--paper);}
.rules-box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:44px;}
.rules-box ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;}
.rules-box li{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);font-size:1.02rem;color:#2c2f36;line-height:1.5;align-items:flex-start;}
.rules-box li:last-child{border-bottom:none;}
.rule-check-icon{
  width:22px;height:22px;border-radius:50%;background:#FFF0E6;color:var(--orange);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;
}
.rules-box li strong{color:var(--navy);}

/* ---------- prizes ---------- */
#prizes{
  background:linear-gradient(180deg,var(--navy) 0%, var(--navy-2) 100%);color:#fff;
}
#prizes .section-head h2, #prizes .section-head p{color:#fff;}
#prizes .section-head p{color:rgba(255,255,255,.72);}
#prizes .pool{text-align:center;margin-bottom:48px;}
#prizes .pool .amount{font-family:'Inter',sans-serif;font-size:clamp(3rem,7vw,4.6rem);font-weight:700;color:var(--orange-2);}
#prizes .pool .cap{color:rgba(255,255,255,.65);font-size:1.05rem;margin-top:6px;}
.placements{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
.place-card{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;
  padding:36px 24px;text-align:center;transition:transform .25s, border-color .25s;
}
.place-card:hover{transform:translateY(-4px);}
.place-card.first{background:rgba(255,138,61,.12);border-color:rgba(255,138,61,.4);box-shadow:0 12px 30px rgba(234,88,12,0.15);}
.place-badge-wrap{
  width:64px;height:64px;margin:0 auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
}
.place-card.first .place-badge-wrap{background:linear-gradient(135deg, #F59E0B, #B45309);color:#FFF;box-shadow:0 6px 16px rgba(245,158,11,0.35);}
.place-card.second .place-badge-wrap{background:linear-gradient(135deg, #94A3B8, #475569);color:#FFF;box-shadow:0 6px 16px rgba(148,163,184,0.3);}
.place-card.third .place-badge-wrap{background:linear-gradient(135deg, #D97706, #78350F);color:#FFF;box-shadow:0 6px 16px rgba(217,119,6,0.25);}
.place-badge-wrap svg{width:32px;height:32px;}
.place-card h4{margin:0 0 8px;font-size:1.1rem;font-weight:600;color:rgba(255,255,255,.9);}
.place-card .amt{font-family:'Inter',sans-serif;font-size:2rem;font-weight:700;color:#fff;}
.cert-note{
  margin-top:36px;background:rgba(18,169,160,.12);border:1px solid rgba(18,169,160,.35);
  border-radius:14px;padding:20px 28px;text-align:center;color:#d6f5f2;font-size:1rem;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:12px;
}
.cert-note svg{width:22px;height:22px;color:var(--teal);flex-shrink:0;}
@media (max-width:720px){ .placements{grid-template-columns:1fr;} }

/* ---------- podium special layout ---------- */
#placements {
  display: flex !important;
  align-items: flex-end !important;
  justify-content: center !important;
  gap: 28px !important;
  max-width: 960px !important;
  margin: 0 auto !important;
}
.place-card {
  box-sizing: border-box;
  position: relative;
  width: 100%;
  border-radius: 24px !important;
  transition: transform 0.3s cubic-bezier(0.2,0.8,0.2,1), box-shadow 0.3s ease !important;
  overflow: hidden;
}
.place-card:hover {
  transform: translateY(-6px) !important;
}

/* FIRST PLACE / GOLD */
.place-card.first {
  order: 2;
  flex: 1.15 !important;
  min-height: 330px !important;
  padding: 44px 28px 36px !important;
  background: radial-gradient(130% 100% at 50% 0%, rgba(251, 191, 36, 0.22) 0%, rgba(217, 119, 6, 0.1) 60%, rgba(15, 27, 56, 0.95) 100%) !important;
  border: 2px solid rgba(251, 191, 36, 0.75) !important;
  box-shadow: 0 0 45px -8px rgba(245, 158, 11, 0.45), 0 20px 40px -15px rgba(0, 0, 0, 0.6), inset 0 1px 1px 0 rgba(255, 255, 255, 0.4) !important;
  z-index: 3;
  display: flex !important;
  flex-direction: column !important;
  justify-content: center !important;
  align-items: center !important;
}
.place-card.first::before {
  content: '';
  position: absolute;
  top: 0;
  left: 15%;
  right: 15%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #FDE68A, #F59E0B, transparent);
}
.place-card.first .place-badge-wrap {
  width: 72px !important;
  height: 72px !important;
  border-radius: 50% !important;
  background: linear-gradient(135deg, #FDE68A 0%, #F59E0B 45%, #B45309 100%) !important;
  color: #FFF !important;
  box-shadow: 0 8px 24px rgba(245, 158, 11, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.6) !important;
  border: 2px solid rgba(254, 240, 138, 0.6) !important;
  margin-bottom: 16px !important;
}
.place-card.first .podium-rank-tag {
  background: linear-gradient(90deg, rgba(251, 191, 36, 0.3), rgba(217, 119, 6, 0.25)) !important;

  const el = (id) => document.getElementById(id);

  // Data loader with fallback
  async function loadData() {
    try {
      const res = await fetch("data.json");
      if (res.ok) {
        const json = await res.json();
        return json;
      }
    } catch (e) {
      // file:// protocol or offline fallback
    }
    const embedded = el("page-data");
    if (embedded && embedded.textContent.trim()) {
      try {
        return JSON.parse(embedded.textContent);
      } catch (err) {
        console.error("Could not parse embedded page-data JSON", err);
      }
    }
    return null;
  }

  function renderPage(data) {
    if (!data) return;

    // Meta & title
    if (data.meta) {
      if (data.meta.title) document.title = data.meta.title;
      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc && data.meta.description) metaDesc.setAttribute("content", data.meta.description);
    }

    // Top navigation
    if (data.navigation && el("topNav")) {
      el("topNav").innerHTML = data.navigation.map(nav => `<a href="${nav.href}">${nav.label}</a>`).join("");
    }

    // Partner logos
    if (data.partnerLogos && el("partnerLogos")) {
      el("partnerLogos").innerHTML = data.partnerLogos.map(logo => `<img src="${logo.src}" alt="${logo.alt}">`).join("");
    }

    // Hero
    if (data.hero) {
      setText("heroKicker", data.hero.kicker);
      setText("heroTitle", data.hero.title);
      setText("heroTagline", data.hero.tagline);
      setText("register-button-text", data.hero.registerText);
      setText("view-button-text", data.hero.rulebookText);
      if (el("rulebookLink")) el("rulebookLink").href = data.hero.rulebookUrl;

      // Countdown
      if (data.hero.countdown) {
        setText("countdownLabel", data.hero.countdown.label);
        setText("countdownDate", data.hero.countdown.dateText);
        const deadline = new Date(data.hero.countdown.deadline).getTime();
        const updateCountdown = () => {
          const remaining = Math.max(0, deadline - Date.now());
          const totalSeconds = Math.floor(remaining / 1000);
          const days = Math.floor(totalSeconds / 86400);
          const hours = Math.floor((totalSeconds % 86400) / 3600);
          const minutes = Math.floor((totalSeconds % 3600) / 60);
          const seconds = totalSeconds % 60;

          setText("countdownDays", String(days).padStart(2, "0"));
          setText("countdownHours", String(hours).padStart(2, "0"));
          setText("countdownMinutes", String(minutes).padStart(2, "0"));
          setText("countdownSeconds", String(seconds).padStart(2, "0"));
        };
        updateCountdown();
        setInterval(updateCountdown, 1000);
      }
    }

    // Organized by
    if (data.organizedBy && el("orgbyTrack")) {
      setText("orgbyLabel", data.organizedBy.label);
      if (el("orgbyMarquee") && data.organizedBy.ariaLabel) {
        el("orgbyMarquee").setAttribute("aria-label", data.organizedBy.ariaLabel);
      }
      const logos = data.organizedBy.logos || [];
      const marqueeList = [...logos, ...logos];
      el("orgbyTrack").innerHTML = marqueeList.map((logo, idx) => `
        <div class="logo-item" ${idx >= logos.length ? 'aria-hidden="true"' : ''}>
          <img src="${logo.src}" alt="${idx >= logos.length ? '' : logo.alt}">
        </div>
      `).join("");
    }

    if (data.about) {
      setText("aboutEyebrow", data.about.eyebrow);
      setText("aboutTitle", data.about.title);
      if (el("aboutParagraphs")) {

          <div class="stat">
            <div class="stat-icon">${vectorIcons[s.icon] || vectorIcons.trophy}</div>
            <div class="stat-info">

    setupInteractions();

  function setupInteractions() {
    // Registration overlay
    const registrationOverlay = el("registrationOverlay");
    const closeRegistration = registrationOverlay.querySelector(".close-registration");
    const registrationLinks = document.querySelectorAll('a[href="#registration"]');
    let lastRegistrationTrigger = null;

    const openRegistration = (event) => {
      event.preventDefault();
      lastRegistrationTrigger = event.currentTarget;
      registrationOverlay.classList.add("is-open");
      registrationOverlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("registration-open");
      closeRegistration.focus();
    };

    const closeRegistrationOverlay = () => {
      registrationOverlay.classList.remove("is-open");
      registrationOverlay.setAttribute("aria-hidden", "true");
      document.body.classList.remove("registration-open");
      if (lastRegistrationTrigger) lastRegistrationTrigger.focus();
    };

    registrationLinks.forEach(link => link.addEventListener("click", openRegistration));
    closeRegistration.addEventListener("click", closeRegistrationOverlay);
    registrationOverlay.addEventListener("click", event => {
      if (event.target === registrationOverlay) closeRegistrationOverlay();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && registrationOverlay.classList.contains("is-open")) {
        closeRegistrationOverlay();
      }
    });

    // Scroll reveal observer
    const targets = document.querySelectorAll("[data-reveal]");
    targets.forEach(target => {
      target.classList.remove("in");
      target.querySelectorAll(".in").forEach(child => child.classList.remove("in"));
    });
    const io = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add("in");
          if (entry.target.hasAttribute("data-reveal-group")) {
            Array.from(entry.target.children).forEach((child, i) => {
              child.style.setProperty("--i", i);
              child.classList.add("in");
            });
          }
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: "0px 0px -60px 0px" });
    targets.forEach(t => io.observe(t));

    document.querySelectorAll("[data-reveal-group] > *").forEach(c => {
      c.style.opacity = 0;
      c.style.transform = "translateY(18px)";
      c.style.transition = "opacity .6s cubic-bezier(.2,.7,.2,1), transform .6s cubic-bezier(.2,.7,.2,1)";
    });
  }

  // Kick off loading and rendering
  loadData().then(renderPage);
})();
